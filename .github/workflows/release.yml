name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p ast-graph-cli

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          BIN=ast-graph
          STAGE="ast-graph-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/$BIN" "$STAGE/"
          cp README.md LICENSE "$STAGE/" 2>/dev/null || true
          tar -czf "$STAGE.tar.gz" "$STAGE"
          shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
          echo "ASSET=$STAGE.tar.gz" >> $GITHUB_ENV
          echo "ASSET_SHA=$STAGE.tar.gz.sha256" >> $GITHUB_ENV

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          BIN=ast-graph.exe
          STAGE="ast-graph-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/$BIN" "$STAGE/"
          cp README.md LICENSE "$STAGE/" 2>/dev/null || true
          7z a "$STAGE.zip" "$STAGE"
          certutil -hashfile "$STAGE.zip" SHA256 > "$STAGE.zip.sha256"
          echo "ASSET=$STAGE.zip" >> $GITHUB_ENV
          echo "ASSET_SHA=$STAGE.zip.sha256" >> $GITHUB_ENV

      - name: Read tag message
        id: tag_message
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pull the annotated tag object directly from the GitHub API.
          # `git tag -l` returns empty in CI for tags fetched via actions/checkout
          # so we go to the source of truth.
          TAG_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${GITHUB_REF_NAME}" --jq '.object.sha')
          TAG_TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${GITHUB_REF_NAME}" --jq '.object.type')
          if [ "$TAG_TYPE" = "tag" ]; then
            MSG=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_SHA}" --jq '.message')
          else
            MSG=""
          fi
          if [ -n "$MSG" ]; then
            {
              echo 'body<<TAG_MSG_EOF'
              echo "$MSG"
              echo 'TAG_MSG_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "body=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}
          body: ${{ steps.tag_message.outputs.body }}
          generate_release_notes: ${{ steps.tag_message.outputs.generate == 'true' }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
